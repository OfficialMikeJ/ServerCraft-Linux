# ServerCraft Linux Edition — Docker Compose
# Standard setup (no AAPanel).  For AAPanel see docker-compose.aapanel.yml
#
# Quick start:
#   docker compose up -d --build
#
# With custom port:
#   PANEL_PORT=9090 docker compose up -d --build

version: '3.9'

services:
  servercraft:
    build:
      context: .
      dockerfile: Dockerfile
    image: servercraft:latest
    container_name: servercraft
    restart: unless-stopped

    ports:
      - "${PANEL_PORT:-8080}:8080"      # Web panel
      - "27000-27020:27000-27020/udp"   # Steam game servers (UDP)
      - "27000-27020:27000-27020/tcp"   # Steam game servers (TCP)
      - "9600-9630:9600-9630/udp"       # Additional game ports (UDP)
      - "9600-9630:9600-9630/tcp"       # Additional game ports (TCP)

    # Persistent data on the host — survives container restarts/rebuilds
    volumes:
      - ./data:/opt/servercraft/backend/data
      - ./servers:/opt/servercraft/servers
      - ./mods:/opt/servercraft/mods
      - ./logs:/opt/servercraft/logs
      - ./steamcmd:/opt/servercraft/steamcmd

    environment:
      - SERVERCRAFT_PORT=8080
      - SERVERCRAFT_ROOT_DIR=/opt/servercraft/backend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
