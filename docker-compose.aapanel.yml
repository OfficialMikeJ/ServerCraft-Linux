# ServerCraft Linux Edition — AAPanel (aaPanel) Docker Compose
#
# Recommended setup when running under AAPanel (宝塔面板).
# AAPanel manages Nginx as a reverse proxy; ServerCraft runs as a Docker app
# behind it, so we bind only to localhost and let AAPanel handle SSL/domain.
#
# ── AAPanel setup steps ────────────────────────────────────────────────────────
# 1. In AAPanel → Docker → Compose → paste this file and deploy.
#    OR: run from the shell:
#        docker compose -f docker-compose.aapanel.yml up -d --build
#
# 2. In AAPanel → Website → Add site → choose your domain.
#    Under "Reverse Proxy" set target:  http://127.0.0.1:8080
#
# 3. (Optional) Apply Let's Encrypt SSL from the AAPanel SSL tab.
#
# 4. Open your domain in a browser.  Login: Admin / Password123!
#    Change password immediately.
# ──────────────────────────────────────────────────────────────────────────────

version: '3.9'

services:
  servercraft:
    build:
      context: .
      dockerfile: Dockerfile
    image: servercraft:latest
    container_name: servercraft
    restart: unless-stopped

    # Bind panel port to localhost only — AAPanel Nginx proxies it externally
    ports:
      - "127.0.0.1:${PANEL_PORT:-8080}:8080"   # Proxied by AAPanel Nginx
      - "27000-27020:27000-27020/udp"           # Steam game servers
      - "27000-27020:27000-27020/tcp"
      - "9600-9630:9600-9630/udp"               # Additional game ports
      - "9600-9630:9600-9630/tcp"

    volumes:
      - ./data:/opt/servercraft/backend/data
      - ./servers:/opt/servercraft/servers
      - ./mods:/opt/servercraft/mods
      - ./logs:/opt/servercraft/logs
      - ./steamcmd:/opt/servercraft/steamcmd

    environment:
      - SERVERCRAFT_PORT=8080
      - SERVERCRAFT_ROOT_DIR=/opt/servercraft/backend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

